<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16213e">
<title>부동산학원론 키워드학습 (모바일)</title>
<style>
:root {
  --bg: #f4f5f8;
  --surface: #ffffff;
  --surface-soft: #f8f9fb;
  --border: #e6e8ee;
  --text: #1c2333;
  --text-muted: #6b7280;
  --text-faint: #9aa1b1;
  --navy: #16213e;
  --navy-soft: #1f2a4a;
  --accent: #d97706;
  --accent-soft: #fff4e5;
  --correct: #16a34a;
  --correct-bg: #eefdf3;
  --incorrect: #dc2626;
  --incorrect-bg: #fef1f1;
  --radius-lg: 16px;
  --radius-md: 12px;
  --radius-sm: 8px;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.05);
  --shadow-md: 0 4px 10px rgba(16, 24, 40, 0.06), 0 2px 4px rgba(16, 24, 40, 0.05);
  --shadow-lg: 0 12px 28px rgba(16, 24, 40, 0.10), 0 4px 10px rgba(16, 24, 40, 0.06);
  --bottombar-h: 64px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  -webkit-text-size-adjust: 100%;
  overflow-x: hidden;
  width: 100%;
}

a { color: inherit; text-decoration: none; }
button, a { touch-action: manipulation; }
button { font-family: inherit; cursor: pointer; }

/* ---------- Header ---------- */
header.top {
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--navy);
  color: #fff;
  box-shadow: var(--shadow-md);
  padding-top: env(safe-area-inset-top);
}
.top-inner {
  max-width: 720px;
  margin: 0 auto;
  padding: 12px max(16px, env(safe-area-inset-left)) 12px max(16px, env(safe-area-inset-right));
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 14px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1 1 100%;
  min-width: 0;
}
.brand img.logo {
  height: 18px;
  width: auto;
  display: block;
  filter: brightness(0) invert(1);
  opacity: 0.92;
  flex-shrink: 0;
}
.brand .divider {
  width: 1px;
  height: 18px;
  background: rgba(255,255,255,0.22);
  flex-shrink: 0;
}
.brand h1 {
  font-size: clamp(16px, 4.6vw, 19px);
  font-weight: 800;
  margin: 0;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand h1 .accent-dot { color: var(--accent); }
.credit {
  font-size: 12px;
  color: rgba(255,255,255,0.68);
  white-space: nowrap;
  flex-shrink: 0;
}
.credit strong {
  color: rgba(255,255,255,0.92);
  font-weight: 600;
}

/* progress pill in header */
.header-progress {
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 999px;
  padding: 4px 11px 4px 5px;
  font-size: 12px;
  color: rgba(255,255,255,0.85);
  flex-shrink: 0;
  margin-left: auto;
}
.header-progress .ring {
  width: 18px; height: 18px;
  flex-shrink: 0;
}

/* ---------- Layout ---------- */
.shell {
  max-width: 720px;
  margin: 0 auto;
  padding: 18px max(16px, env(safe-area-inset-left)) 40px max(16px, env(safe-area-inset-right));
}
body.theme-view .shell { padding-bottom: calc(var(--bottombar-h) + 28px + env(safe-area-inset-bottom)); }

/* ---------- Main ---------- */
.main { min-width: 0; }
.status-dot {
  width: 6px; height: 6px; border-radius: 50%;
  flex-shrink: 0;
  background: var(--border);
}
.status-dot.correct { background: var(--correct); }
.status-dot.incorrect { background: var(--incorrect); }

/* Home view */
.hero {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-soft) 60%, #2a3865 100%);
  color: #fff;
  border-radius: var(--radius-lg);
  padding: 24px 22px 22px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.hero::after {
  content: "";
  position: absolute;
  right: -60px; top: -60px;
  width: 200px; height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(217,119,6,0.28) 0%, rgba(217,119,6,0) 70%);
}
.hero h2 {
  margin: 0 0 8px;
  font-size: 19px;
  font-weight: 800;
  line-height: 1.35;
}
.hero p {
  margin: 0;
  font-size: 13.5px;
  color: rgba(255,255,255,0.78);
  line-height: 1.6;
}
.hero-stats {
  display: flex;
  gap: 20px;
  margin-top: 18px;
  flex-wrap: wrap;
}
.hero-stat .num { font-size: 22px; font-weight: 800; }
.hero-stat .lbl { font-size: 11.5px; color: rgba(255,255,255,0.65); margin-top: 2px; }

.section-title {
  font-size: 14.5px;
  font-weight: 800;
  margin: 22px 0 10px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--text);
}
.section-title .line { flex: 1; height: 1px; background: var(--border); }

.part-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
}
@media (min-width: 560px) {
  .part-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (min-width: 860px) {
  .part-grid { grid-template-columns: repeat(3, 1fr); }
}
.part-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
}
.part-card-head {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.part-badge {
  width: 34px; height: 34px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 13px;
  flex-shrink: 0;
}
.part-card-head .pname { font-weight: 800; font-size: 15px; }
.part-card-head .pcount { margin-left: auto; font-size: 12px; color: var(--text-faint); font-weight: 700; }
.part-progress-bar {
  height: 6px;
  background: var(--surface-soft);
  border-radius: 999px;
  overflow: hidden;
  margin-bottom: 8px;
}
.part-progress-fill { height: 100%; border-radius: 999px; transition: width 0.2s ease; }
.part-card-sub { font-size: 12px; color: var(--text-muted); }

.theme-chip-grid {
  display: none;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}
.part-card.expanded .theme-chip-grid { display: grid; }
.theme-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13.5px;
  padding: 11px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-soft);
  color: var(--text);
  border: 1px solid transparent;
  min-height: 44px;
}
.theme-chip .tno { color: var(--text-faint); font-size: 11.5px; flex-shrink: 0; }
.theme-chip .status-dot { margin-left: auto; }

/* Detail view */
.crumb {
  font-size: 12.5px;
  color: var(--text-faint);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.crumb .sep { color: var(--text-faint); }

.theme-header {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 16px;
}
.theme-no-badge {
  flex-shrink: 0;
  width: 42px; height: 42px;
  border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 15px;
}
.theme-header h2 {
  margin: 0 0 4px;
  font-size: 19px;
  font-weight: 800;
  line-height: 1.35;
}
.theme-header .part-tag {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
}

.audio-bar { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; margin-bottom: 15px; }
.audio-toggle-btn, .audio-placeholder {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  font-weight: 700;
  padding: 10px 16px;
  min-height: 44px;
  border-radius: 999px;
}
.audio-toggle-btn {
  background: #eef2ff;
  color: #4338ca;
  border: 1px solid #c7d2fe;
}
.audio-toggle-btn:active { background: #e0e7ff; }
.audio-placeholder {
  background: var(--surface-soft);
  color: var(--text-faint);
  border: 1px dashed var(--border);
}
.audio-player { width: 100%; height: 40px; }
.audio-status {
  font-size: 13px;
  font-weight: 600;
  padding: 10px 14px;
  border-radius: 10px;
  background: #fff7ed;
  color: #9a3412;
  border: 1px solid #fed7aa;
  line-height: 1.5;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 18px 16px;
  margin-bottom: 14px;
}
.card-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 13px;
}
.card-label.step1 { background: #eef2ff; color: #4338ca; }
.card-label.step2 { background: var(--accent-soft); color: #92400e; }

.headline {
  font-size: 17px;
  font-weight: 800;
  margin: 0 0 8px;
  line-height: 1.4;
}
.definition {
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1.65;
  margin: 0 0 15px;
  padding-bottom: 15px;
  border-bottom: 1px dashed var(--border);
}
.bullets { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.bullets li {
  display: flex;
  gap: 10px;
  font-size: 14.5px;
  line-height: 1.55;
  align-items: flex-start;
}
.bullets li .bmark {
  flex-shrink: 0;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--navy);
  margin-top: 8px;
}
.tip-box {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--accent-soft);
  border: 1px solid #fbe1b8;
  border-radius: var(--radius-md);
  padding: 12px 13px;
  font-size: 13.5px;
  color: #7c4a03;
  line-height: 1.55;
}
.tip-box .tip-icon { flex-shrink: 0; font-size: 15px; }
.tip-box b { font-weight: 800; }

.question-text {
  font-size: 15.5px;
  font-weight: 700;
  line-height: 1.6;
  margin: 0 0 16px;
}
.choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
.choice-btn {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  min-height: 48px;
  text-align: left;
  padding: 13px 14px;
  border-radius: var(--radius-md);
  border: 1.5px solid transparent;
  background: var(--surface-soft);
  font-size: 14.5px;
  color: var(--text);
  line-height: 1.5;
  transition: border-color 0.1s ease, background 0.1s ease;
}
.choice-btn:active:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.choice-btn:disabled { cursor: default; }
.choice-num {
  flex-shrink: 0;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1.5px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 19px; font-weight: 700;
  color: var(--text-muted);
}
.choice-btn.selected .choice-num { border-color: var(--navy); background: var(--navy); color: #fff; }
.choice-btn.correct-answer { border-color: var(--correct); background: var(--correct-bg); }
.choice-btn.correct-answer .choice-num { border-color: var(--correct); background: var(--correct); color: #fff; }
.choice-btn.wrong-answer { border-color: var(--incorrect); background: var(--incorrect-bg); }
.choice-btn.wrong-answer .choice-num { border-color: var(--incorrect); background: var(--incorrect); color: #fff; }
.choice-mark { margin-left: auto; font-size: 14.5px; font-weight: 800; flex-shrink: 0; }
.choice-mark.ok { color: var(--correct); }
.choice-mark.no { color: var(--incorrect); }

.result-banner {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 12px 15px;
  border-radius: var(--radius-md);
  font-weight: 800;
  font-size: 14px;
  margin: 14px 0;
}
.result-banner.show { display: flex; }
.result-banner.ok { background: var(--correct-bg); color: #15803d; }
.result-banner.no { background: var(--incorrect-bg); color: #b91c1c; }

.explain-box {
  display: none;
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 14px 15px;
  margin-top: 4px;
}
.explain-box.show { display: block; }
.explain-box .elabel {
  font-size: 11px;
  font-weight: 800;
  color: var(--text-faint);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  margin-bottom: 6px;
}
.explain-box p { margin: 0; font-size: 13.5px; line-height: 1.65; color: var(--text); }

.quiz-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
.retry-btn {
  display: none;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 9px 15px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-muted);
  min-height: 40px;
}
.retry-btn.show { display: inline-flex; }

/* nav footer: fixed bottom tab bar on theme pages for thumb-friendly navigation */
.nav-footer {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.94);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 14px rgba(16,24,40,0.08);
  padding: 10px max(16px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-right));
  max-width: 720px;
  margin: 0 auto;
}
.nav-btn {
  display: flex;
  flex: 1;
  justify-content: center;
  align-items: center;
  gap: 6px;
  padding: 11px 10px;
  min-height: 44px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--surface);
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text);
}
.nav-btn.disabled { opacity: 0.35; pointer-events: none; }
.nav-btn.list-btn { background: var(--navy); color: #fff; border-color: var(--navy); flex: 1.1; }

.footer-note {
  text-align: center;
  color: var(--text-faint);
  font-size: 11.5px;
  margin-top: 36px;
  line-height: 1.7;
}

/* icons */
.icon { width: 14px; height: 14px; display: inline-block; vertical-align: middle; }
</style>
</head>

재가격상승→수요감소"], "tip": "가격변화=수요량 변화(곡선상 이동) vs 가격외 요인변화=수요 변화(곡선자체 이동)", "q": "부동산 수요에 관한 설명으로 옳지 않은 것은?", "choices": ["부동산가격 변화에 의한 수요량의 변화는 수요곡선 자체의 이동으로 나타난다.", "부동산가격이 상승하면 수요량은 감소한다.", "소득이 증가할 때 정상재는 수요가 증가한다.", "대체재의 가격이 상승하면 해당 재화의 수요는 증가한다.", "보완재의 가격이 상승하면 해당 재화의 수요는 감소한다."], "ans": 1, "expl": "가격변화에 의한 수요량의 변화는 기존 수요곡선상에서 점이 이동하는 것이다. 수요곡선 자체의 이동은 가격 이외 요인이 변화하는 '수요의 변화'이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_009.m4a"}, {"no": 10, "part": "경제론", "theme": "부동산 공급의 결정요인", "headline": "부동산 공급결정요인", "definition": "부동산 공급의 결정: 가격 외에도 생산요소가격·기술수준·금리 등 다양한 요인의 영향", "bullets": ["공급법칙: 가격과 공급량은 비례(우상향곡선)", "생산요소가격(건축비 등) 상승→공급감소", "기술수준 향상→공급증가", "금리인상→공급감소, 조세인상→공급감소"], "tip": "토지는 물리적공급 불가, 경제적공급(집약적 이용 등)만 가능", "q": "부동산 공급에 관한 설명으로 옳지 않은 것은?", "choices": ["부동산가격이 상승하면 공급량은 증가한다.", "건축비 등 생산요소의 가격이 상승하면 공급은 감소한다.", "금리가 상승하면 자본비용이 높아져 공급이 감소한다.", "토지는 부증성으로 인해 물리적 공급이 가능하다.", "조세가 인상되면 부동산 공급은 감소한다."], "ans": 4, "expl": "토지는 부증성으로 인해 물리적 공급이 불가능하며, 토지이용의 집약화 등을 통한 경제적 공급만 가능하다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_010.m4a"}, {"no": 11, "part": "경제론", "theme": "부동산시장의 균형과 가격결정", "headline": "균형가격의 결정과 이동", "definition": "부동산가격의 결정: 수요곡선과 공급곡선이 교차하는 균형점", "bullets": ["균형점보다 높은 가격: 초과공급→가격하락압력", "균형점보다 낮은 가격: 초과수요→가격상승압력", "수요증가·공급불변→가격상승, 거래량증가", "공급증가·수요불변→가격하락, 거래량증가"], "tip": "수요증가+공급감소=가격 무조건 상승 / 수요감소+공급증가=가격 무조건 하락(거래량은 불확실)", "q": "부동산시장의 균형가격에 관한 설명으로 옳지 않은 것은?", "choices": ["균형가격은 수요곡선과 공급곡선이 교차하는 점에서 결정된다.", "수요가 증가하고 공급이 불변이면 균형가격은 상승하고 거래량은 증가한다.", "수요와 공급이 동시에 증가하면 거래량은 증가한다.", "공급이 증가하고 수요가 불변이면 균형가격은 상승하고 거래량은 감소한다.", "균형가격보다 높은 가격에서는 초과공급이 발생하여 가격 하락압력이 존재한다."], "ans": 4, "expl": "공급이 증가하고 수요가 불변이면 초과공급이 발생하여 균형가격은 하락하고 거래량은 증가한다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_011.m4a"}, {"no": 12, "part": "경제론", "theme": "부동산 수요·공급의 가격탄력성", "headline": "수요의 가격탄력성", "definition": "수요의 가격탄력성: 가격변동률 대비 수요량변동률의 비율, 부동산 종류별로 크기 상이", "bullets": ["탄력성>1: 탄력적(사치품), <1: 비탄력적(필수품)", "대체재 많고 용도 다양·기간 길수록 탄력적", "주거용>상업용·공업용(대체공간 넓어 더 탄력적)", "세분화될수록(단독주택,아파트 등) 탄력성 커짐"], "tip": "탄력적일 때 가격상승→총수입감소 / 비탄력적일 때 가격상승→총수입증가", "q": "부동산 수요의 가격탄력성에 관한 설명으로 옳지 않은 것은?", "choices": ["주거용 부동산은 상업용·공업용 부동산보다 대체재가 적어 더 비탄력적이다.", "수요의 가격탄력성이 1보다 크면 탄력적이라고 한다.", "일반적으로 재화의 용도가 다양할수록 탄력적이다.", "수요가 탄력적인 경우 가격이 상승하면 기업의 총수입은 감소한다.", "부동산을 종류별로 세분화할수록 수요의 가격탄력성은 커지는 경향이 있다."], "ans": 1, "expl": "주거용 부동산은 상업용·공업용 부동산보다 대체공간이 넓어 더 탄력적이다. 상업용·공업용 부동산이 지역적·국지적 영향을 더 많이 받아 대체재가 적고 비탄력적이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_012.m4a"}, {"no": 13, "part": "경제론", "theme": "부동산 경기변동의 개념과 국면", "headline": "부동산경기의 순환국면", "definition": "부동산경기의 순환국면: 회복-상향-후퇴-하향시장의 4국면 + 부동산 특유의 안정시장", "bullets": ["회복시장: 매도자중시로 전환, 가격상승 시작", "상향시장: 매도자주도(Seller's Market), 거래활발", "후퇴시장: 매도자중시→매수자중시 전환", "하향시장: 매수자주도(Buyer's Market), 공실률 증가"], "tip": "안정시장은 부동산시장에만 있는 고유국면(불황에 강한 소규모주택·도심부동산)", "q": "부동산경기의 순환국면에 관한 설명으로 옳지 않은 것은?", "choices": ["하향시장에서는 매도자가 주도하는 시장(Seller's Market) 현상이 나타난다.", "회복시장에서는 매수자 중시에서 매도자 중시 현상으로 바뀐다.", "상향시장에서는 매도자가 주도하는 시장(Seller's Market) 현상이 나타난다.", "후퇴시장에서는 매도자 중시에서 매수자 중시로 바뀐다.", "안정시장은 불황에 강한 부동산시장 특유의 국면이다."], "ans": 1, "expl": "하향시장에서는 매수자가 주도하는 시장(Buyer's Market) 현상이 커진다. 매도자 주도 현상은 상향시장의 특징이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_013.m4a"}, {"part": "경제론", "theme": "부동산 경기변동의 유형(계절적·장기적·무작위적 변동)", "headline": "경기변동의 다른 유형들", "definition": "부동산 경기변동의 유형: 순환적 변동 외에 계절적 변동·장기적(추세) 변동·무작위적(불규칙) 변동", "bullets": ["계절적변동: 이사철 등 역일·풍속·관습의 영향에 따른 주기적 변동", "장기적변동(추세변동): 50년 이상 장기간, 지역개발·재개발시 발생", "무작위적변동(불규칙변동): 지진·홍수·전쟁 등 예기치 못한 요인", "부동산경기 장기변동은 일반경기 변동보다 기간 길고 지역적으로 불규칙"], "tip": "계·장·무 3유형 + 순환적변동(국면) = 경기변동의 4대 유형", "q": "부동산 경기변동의 유형에 관한 설명으로 옳지 않은 것은?", "choices": ["계절적 변동은 이사철 등 역일이나 풍속·관습의 영향으로 나타나는 경기변동이다.", "부동산경기의 장기변동은 일반적으로 일반경제의 변동보다 기간이 길고 지역적으로 규칙적으로 나타난다.", "장기적 변동은 통상 50년 이상의 기간으로 측정되며 추세변동이라고도 한다.", "무작위적 변동은 지진, 홍수, 전쟁 등 예기치 못한 사태로 인해 초래되는 비주기적 변동이다.", "장기적 변동은 어떤 지역이 새로 개발되거나 기존 지역이 재개발될 때 나타날 수 있다."], "ans": 2, "expl": "부동산경기의 장기변동은 일반경제의 변동보다 기간이 길고 지역적으로 불규칙하게 나타나는 특징이 있다.", "no": 14, "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_014.m4a"}, {"part": "경제론", "theme": "거미집이론(Cob-web Theory)", "headline": "거미집이론", "definition": "거미집이론: 수요·공급의 시차를 고려해 가격이 균형에 접근하는 과정을 설명하는 동태적 이론(에치켈이 농산물가격의 순환적 변동을 이론화)", "bullets": ["수요는 금기가격에, 공급은 전기가격에 반응(시차)", "수렴형: 수요 가격탄력성>공급 가격탄력성 (기울기는 반대로 공급기울기>수요기울기)", "발산형: 공급 가격탄력성>수요 가격탄력성 (기울기는 반대로 수요기울기>공급기울기)", "순환형: 수요탄력성=공급탄력성(기울기도 동일)", "실제 시장에서는 공급자가 미래가격을 예측하며 행동하므로 완전히 들어맞지는 않는 한계가 있음"], "tip": "'수탄수(수요탄력적→수렴)' vs '공탄발(공급탄력적→발산)', 기울기는 탄력성과 반대관계임에 유의", "q": "거미집이론(Cob-web Theory)에 관한 설명으로 옳지 않은 것은?", "choices": ["금기의 수요량은 금기가격의 함수이고, 금기의 공급량은 전기가격의 함수라고 가정한다.", "수요의 가격탄력성이 공급의 가격탄력성보다 크면 수렴형이 된다.", "거미집이론은 주로 주거용 부동산에 더 잘 적용되는 이론이다.", "공급의 가격탄력성이 수요의 가격탄력성보다 크면 발산형이 된다.", "수요와 공급의 가격탄력성이 같으면 순환형이 된다."], "ans": 3, "expl": "거미집이론에 따른 주기적 가격변동 현상은 생필품적 성격의 주거용 부동산보다 상업용·공업용 부동산에 더 잘 적용된다.", "no": 15, "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_015.m4a"}, {"no": 16, "part": "시장론", "theme": "부동산시장의 개념과 특성", "headline": "부동산시장의 특성", "definition": "부동산시장의 성격: 부동산 특성으로 인해 완전경쟁시장이 아닌 불완전경쟁시장", "bullets": ["시장의 국지성: 부동성·개별성에 기인, 지역시장화", "거래의 비공개성: 정보유통 불완전", "수급조절 곤란성: 공급의 비탄력성", "매매의 장기성, 중개업자 개입 필요성"], "tip": "불완전경쟁시장이지만 독과점시장은 아님", "q": "부동산시장의 특성에 관한 설명으로 옳지 않은 것은?", "choices": ["부동산시장은 거래정보가 완전히 공개되어 정보의 불완전성이 없다.", "부동산시장은 부동성과 개별성으로 인해 시장이 국지화되는 경향이 있다.", "부동산은 수요와 공급이 비탄력적이어서 단기적으로 가격왜곡이 발생할 가능성이 높다.", "부동산 거래에는 탐색, 계약체결 등 여러 절차가 필요하여 매매기간이 장기화되는 경향이 있다.", "부동산시장은 매도인과 매수인의 직접 참여가 곤란하여 중개업자의 개입이 필요하다."], "ans": 1, "expl": "부동산시장은 개별성·다액자금 필요성·행정적 규제 등으로 거래내용의 공개가 저해되어 정보유통이 불완전하다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_016.m4a"}, {"no": 17, "part": "시장론", "theme": "디파스퀄리-위튼(4사분면) 모형", "headline": "4사분면 모형", "definition": "디파스퀄리-위튼 모형: 공간시장·자산시장·건설(개발)시장의 유기적 상호작용을 설명하는 4사분면 모형", "bullets": ["공간시장(1사분면): 임대시장, 균형임대료·점유율 결정", "자산시장(2사분면): 부동산가격 결정", "건설시장(3사분면): 개발이익 있으면 개발결정", "4사분면: 장기적으로 부동산 재고량 변화"], "tip": "공간시장='빌리는 시장', 자산시장='사고파는 시장'", "q": "디파스퀄리-위튼(DiPasquale & Wheaton)의 4사분면 모형에 관한 설명으로 옳지 않은 것은?", "choices": ["공간시장에서는 균형임대료와 점유율이 결정된다.", "임대료와 자본환원율에 따라 자산가격이 결정된다.", "건설(개발)시장에서는 개발비용이 시가보다 낮아 개발이익이 발생하면 개발이 이루어진다.", "자산시장은 공간을 사고파는 시장이 아니라 공간을 빌리고 빌려주는 임대시장을 의미한다.", "공간시장의 임대수요는 주로 지역 및 국가경제 상황에 크게 영향을 받는다."], "ans": 4, "expl": "공간을 빌리고 빌려주는 임대시장은 '공간시장(1사분면)'이다. 자산시장(2사분면)은 부동산을 자산으로서 사고파는 시장이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_017.m4a"}, {"no": 18, "part": "시장론", "theme": "효율적 시장이론", "headline": "효율적 시장의 유형", "definition": "효율적시장이론: 새로운 정보가 지체없이 가격에 반영되는 시장, 반영되는 정보범위에 따라 3가지 유형(약성·준강성·강성)", "bullets": ["약성 효율적시장: 과거정보만 반영(기술적분석으로 초과이익 불가)", "준강성 효율적시장: 과거+공표된 현재정보 반영(기본적분석으로 초과이익 불가)", "강성 효율적시장: 과거+현재+미래(내부)정보까지 모두 반영", "어떤 유형이든 정상이윤은 획득 가능"], "tip": "약성=기술적분석, 준강성=기본적분석, 강성=분석불필요(어떤정보로도 초과이익 불가)", "q": "효율적 시장이론에 관한 설명으로 옳지 않은 것은?", "choices": ["약성 효율적 시장은 과거의 역사적 정보가 이미 시장가치에 반영된 시장이다.", "강성 효율적 시장은 과거, 현재, 미래(내부)정보까지 모두 반영된 시장이다.", "준강성 효율적 시장에서는 기본적 분석을 통해 정상 이상의 수익을 획득할 수 있다.", "일반적으로 부동산시장이나 주식시장에서는 강성 효율적 시장은 잘 나타나지 않는다.", "약성 효율적 시장에서 초과이익을 얻었다면 이는 과거 정보가 아닌 현재나 미래 정보에 의한 것이다."], "ans": 3, "expl": "준강성 효율적 시장의 참여자들은 이미 기본적 분석을 하고 있다고 전제되므로, 기본적 분석을 통해서는 정상 이상의 수익(초과이익)을 획득할 수 없다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_018.m4a"}, {"no": 19, "part": "시장론", "theme": "주거분리와 여과현상", "headline": "주거분리와 여과현상", "definition": "여과현상·주거분리: 여과현상은 주택이 소득계층에 따라 상하로 이동하는 현상, 그 결과 고소득층·저소득층의 주거지역이 분리되는 현상이 주거분리", "bullets": ["하향여과: 상위계층 주택이 하위계층에게 전환", "상향여과: 하위계층 주택이 수선·재개발되어 상위계층에게 전환", "침입과 계승: 이질적 요소 침입으로 지역용도 변화", "불량주택문제는 시장실패가 아니라 소득의 문제"], "tip": "하향여과='비싼집이 싸짐', 상향여과='싼집이 비싸짐'", "q": "주거분리와 여과현상에 관한 설명으로 옳지 않은 것은?", "choices": ["하향여과란 상위계층이 사용하던 주택이 하위계층의 사용으로 전환되는 현상이다.", "불량주택문제는 시장실패에 따른 것이므로 정부의 시장개입으로 근본적으로 해결할 수 있다.", "상향여과란 하위계층이 사용하던 주택이 수선·재개발되어 상위계층 사용으로 전환되는 현상이다.", "고소득층 주거지역은 수리·개량비용보다 가치상승분이 클 때 계속 고급주택지역으로 유지된다.", "이질적 요소의 침입으로 한 지역의 토지이용이 다른 종류로 변화되어가는 것을 천이와 계승이라 한다."], "ans": 2, "expl": "불량주택문제는 시장실패가 아니라 소득의 문제로 발생한 것이므로, 철거와 같은 정부의 시장개입만으로는 근본적으로 해결하기 어렵다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_019.m4a"}, {"no": 20, "part": "시장론", "theme": "지대이론", "headline": "지대결정이론", "definition": "지대이론: 지대(토지서비스의 대가)의 결정원리를 설명하는 이론, 학자별 견해 차이 존재", "bullets": ["차액지대설(리카도): 비옥도 차이, 한계지는 지대0", "입지교차지대설(튀넨): 수송비 절약분이 지대화(위치지대)", "절대지대설(마르크스): 토지사유화 자체가 지대발생근거", "지대=유량개념(일정기간), 지가=저량개념(일정시점)"], "tip": "지가=지대/할인율(지대가 영속적인 경우)", "q": "지대이론에 관한 설명으로 옳지 않은 것은?", "choices": ["리카도의 차액지대설에 따르면 한계지에서는 지대가 발생하지 않는다.", "마르크스의 절대지대설은 토지의 비옥도나 위치와 관계없이 토지사유화 자체를 지대발생의 근거로 본다.", "튀넨의 입지교차지대설에 따르면 수송비가 절약될수록 지대는 낮아진다.", "지대는 일정기간을 기준으로 하는 유량개념이고, 지가는 일정시점을 기준으로 하는 저량개념이다.", "지대가 영속적인 경우 지가는 지대를 할인율로 나누어 산정할 수 있다."], "ans": 3, "expl": "튀넨의 입지교차지대설에 따르면 수송비가 절약될수록(중심지에 가까울수록) 지대는 높아진다. 수송비와 지대는 반비례 관계이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_020.m4a"}, {"no": 21, "part": "시장론", "theme": "산업입지이론", "headline": "산업입지이론", "definition": "산업입지이론: 공장 등 산업시설의 최소비용 또는 최대이윤 위치 선정원리", "bullets": ["베버: 최소운송비→노동비절약→집적이익지점 순 검토(비용최소화)", "뢰쉬: 이윤극대화 관점, 시장확대가능성 큰 곳이 최적입지(수요측면)", "뢰쉬는 베버가 생산비에만 치우쳤다고 비판", "원료지향형(중량감소산업) vs 시장지향형(중량증가산업) 구분"], "tip": "베버=비용최소화(공급측), 뢰쉬=이윤극대화(수요측)", "q": "산업입지이론에 관한 설명으로 옳지 않은 것은?", "choices": ["시장지향형 산업은 산출제품의 무게나 부피가 투입원료보다 작은 경우에 주로 나타난다.", "베버의 공업입지론은 최소운송비 지점을 최적입지의 기본으로 본다.", "뢰쉬는 베버의 입지론이 생산비에만 치우쳐 있다고 비판하며 시장확대가능성이 가장 풍부한 곳을 최적입지로 보았다.", "원료지향형 산업은 중량감소산업이나 부패하기 쉬운 원료를 사용하는 공장에서 주로 나타난다.", "그린헛은 한계수익과 한계비용이 일치하는 지점을 최적입지로 보았다."], "ans": 1, "expl": "시장지향형 산업은 산출제품의 무게나 부피가 투입원료보다 큰 경우(중량증가산업 등)에 주로 나타난다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_021.m4a"}, {"no": 22, "part": "시장론", "theme": "상업입지이론", "headline": "상업입지이론(상점분포)", "definition": "상업입지이론: 상점의 최대매출 확보 입지를 설명하는 이론, 공간균배의 원리·점포유형별 입지경향이 대표적", "bullets": ["공간균배원리: 수요탄력성 클수록 분산입지, 작을수록 집심입지", "집심성점포(백화점 등)/집재성점포(은행 등)/산재성점포(목욕탕 등)", "구매빈도 높을수록 점포밀도 높음(편의품점)", "넬슨 8원칙: 양립성, 집중흡입력 등"], "tip": "상품도달거리: 전문품점>선매품점>편의품점", "q": "상업입지이론에 관한 설명으로 옳지 않은 것은?", "choices": ["공간균배의 원리에 따르면 수요의 탄력성이 클수록 분산입지 경향이 나타난다.", "목욕탕, 이발소와 같은 산재성 점포는 동일업종끼리 한 곳에 모이는 것이 유리하다.", "백화점과 같은 집심성 점포는 도심에서 형성되는 것이 경영상 유리하다.", "전문품점은 편의품점보다 상품의 도달거리가 길다.", "넬슨의 소매입지이론에서 양립성이란 인접점포가 서로 고객을 주고받는 현상을 의미한다."], "ans": 2, "expl": "산재성 점포는 동일업종의 점포가 서로 분산되어야 유리한 점포이다. 동일업종이 한 곳에 모이는 것이 유리한 것은 집재성 점포이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_022.m4a"}, {"no": 23, "part": "시장론", "theme": "크리스탈러의 중심지이론", "headline": "크리스탈러 중심지이론", "definition": "중심지이론: 주변지역에 재화·서비스를 공급하는 중심지의 성립조건과 계층구조 설명", "bullets": ["중심지 성립조건: 최소요구치<재화의 도달범위", "배후지는 경쟁최소화 위해 정육각형 형태로 수렴", "고차중심지일수록 배후지 넓고 수는 적음(피라미드형)", "최소요구치 크기: 전문품점>선매품점>편의품점"], "tip": "시장원리(k=3)/교통원리(k=4)/행정원리(k=7)", "q": "크리스탈러의 중심지이론에 관한 설명으로 옳지 않은 것은?", "choices": ["중심지가 성립하기 위해서는 최소요구치가 재화의 도달범위보다 작아야 한다.", "이상적인 배후지의 형태는 경쟁을 최소화하기 위해 정육각형에 가까워진다.", "최소요구치의 크기는 편의품점이 전문품점보다 크다.", "고차중심지일수록 배후지의 규모가 크고 중심지의 수는 적어진다.", "행정원리(k=7)는 상위중심지의 배후지가 가장 넓게 나타나는 포섭원리이다."], "ans": 3, "expl": "최소요구치의 크기는 전문품점>선매품점>편의품점 순이다. 편의품점은 최소요구치가 가장 작다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_023.m4a"}, {"no": 24, "part": "시장론", "theme": "도시공간(내부)구조이론", "headline": "도시공간구조이론", "definition": "도시공간구조이론: 버제스의 동심원이론, 호이트의 선형이론, 해리스·울만의 다핵심이론 등 도시 내부 토지이용 패턴 설명이론", "bullets": ["동심원이론(버제스): 5개지대(CBD-점이지대-저소득-중산층-통근자)", "선형이론(호이트): 교통망축따라 부채꼴모양 확장, 고급주택은 축 인근", "다핵심이론(해리스·울만): 도시핵이 여러개, 입지조건따라 형성", "동심원이론은 시카고시만 대상 연구로 일반성 결여 비판"], "tip": "동심원=원형(단핵), 선형=부채꼴(축), 다핵심=여러개핵", "q": "도시공간(내부)구조이론에 관한 설명으로 옳지 않은 것은?", "choices": ["버제스의 동심원이론에 따르면 중심업무지구(CBD)를 중심으로 5개의 지대가 동심원 형태로 배열된다.", "해리스와 울만의 다핵심이론에 따르면 도시는 하나의 핵을 중심으로 성장한다.", "호이트의 선형이론에 따르면 고급주택은 교통망의 축에 가까이 입지하는 경향이 있다.", "동심원이론은 시카고시만을 대상으로 한 연구로 도시공간구조에 대한 일반성이 결여되었다는 비판을 받는다.", "선형이론은 도시공간이 교통노선을 따라 부채꼴 모양으로 확대·배치된다고 본다."], "ans": 2, "expl": "해리스와 울만의 다핵심이론에 따르면 도시의 핵심은 하나가 아니라 여러 개이며, 도시는 복수의 핵 주변에서 성장한다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_024.m4a"}, {"no": 25, "part": "정책론", "theme": "시장실패와 정부개입 필요성", "headline": "시장실패와 정부개입", "definition": "시장실패: 가격기능이 원활히 작동하지 못해 효율적 자원배분이 이루어지지 못하는 상태(정부개입의 근거)", "bullets": ["시장실패원인: 외부효과, 불완전경쟁, 공공재, 정보비대칭, 규모의경제", "외부경제(정+): 공급곡선불변, 수요곡선우측이동, PIMFY", "외부불경제(부-): 규제시 공급곡선좌상향이동, NIMBY", "정부실패: 정부개입이 오히려 상황 악화시키는 경우"], "tip": "PIMFY(외부경제, 환영) vs NIMBY(외부불경제, 기피)", "q": "시장실패와 정부개입에 관한 설명으로 옳지 않은 것은?", "choices": ["정부가 시장에 개입하면 항상 자원배분이 개선되므로 정부실패는 발생하지 않는다.", "시장실패란 시장의 가격기능이 원활히 작동하지 못해 효율적 자원배분이 이루어지지 못하는 상태이다.", "외부경제가 발생하면 공급곡선은 불변인 채 수요곡선이 우상향으로 이동하는 효과가 나타난다.", "외부불경제를 유발하는 시설에 대해서는 님비(NIMBY)현상이 나타난다.", "공공재는 비경합성과 비배제성을 가지므로 무임승차 문제가 발생하기 쉽다."], "ans": 1, "expl": "정부의 개입이 오히려 자원의 최적배분을 저해하거나 상황을 악화시키는 경우를 정부실패라고 하며, 정보부족, 부적절한 정책수립 등으로 인해 발생할 수 있다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_025.m4a"}, {"no": 26, "part": "정책론", "theme": "부동산정책의 수단", "headline": "부동산정책의 수단", "definition": "토지정책의 수단: 직접개입방식·간접개입방식(시장기능 활용)·토지이용규제방식으로 구분", "bullets": ["직접개입: 토지비축, 토지수용·선매, 공영개발, 공공임대주택", "간접개입: 금융지원, 보조금·부담금, 조세감면", "토지이용규제: 용도지역지구제, 거래허가제, 개발권양도제(TDR)", "분양가상한제는 직접개입, 개발부담금제는 간접개입 수단"], "tip": "직접=정부가 직접 참여/시장참여자 역할 vs 간접=시장기구 틀 유지하며 유도", "q": "부동산정책의 수단에 관한 설명으로 옳지 않은 것은?", "choices": ["토지비축제도는 정부의 직접개입방식에 해당한다.", "각종 보조금이나 부담금 지원은 간접개입방식에 해당한다.", "용도지역지구제는 토지이용을 규제하는 수단에 해당한다.", "분양가상한제는 정부의 직접적 시장개입 수단이다.", "개발부담금제는 정부의 직접적 시장개입 수단이다."], "ans": 5, "expl": "개발부담금제는 정부가 시장기구의 틀을 유지하면서 경제적 동기를 조성하는 간접적 개입수단이다. 직접적 개입수단은 분양가상한제, 토지수용, 공영개발 등이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_026.m4a"}, {"no": 27, "part": "정책론", "theme": "외부효과와 지역지구제", "headline": "외부효과와 지역지구제", "definition": "외부효과: 시장가격에 반영되지 않으면서 제3자에게 의도치 않은 이익·손해를 주는 효과(지역지구제가 대표적 규제수단)", "bullets": ["외부경제: 사적비용>사회적비용, 과소생산, PIMFY", "외부불경제: 사적비용<사회적비용, 과대생산, NIMBY", "대책: 적극적개입(용도지역지구제, 과징금) vs 간접적개입(코오즈정리)", "지역지구제는 부(-)의 외부효과 방지가 주된 목적"], "tip": " : "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_045.m4a"}, {"no": 46, "part": "투자론", "theme": "부동산투자의 결정과정", "headline": "부동산투자의 결정과정", "definition": "부동산투자결정과정: 투자목적 파악 → 투자환경 분석 → 현금수지 분석 → 투자준거 적용 → 최종 투자결정의 단계", "bullets": ["1단계: 투자자의 목적 파악", "2단계: 투자환경(시장환경) 분석", "3단계: 기대되는 편익과 비용(현금수지) 분석", "4단계: 투자준거 적용 → 기대수익률≥요구수익률이면 투자 채택"], "tip": "목적파악→환경분석→현금수지분석→투자준거적용→투자결정 순서", "q": "부동산투자의 결정과정에 관한 설명으로 옳지 않은 것은?", "choices": ["투자결정과정에서 가장 먼저 이루어져야 하는 것은 투자자의 목적 파악이다.", "기대수익률이 요구수익률보다 낮을 때 투자를 채택한다.", "투자환경 분석 이후 기대되는 편익과 비용을 현금수지로 측정하는 단계가 이어진다.", "분석된 현금수지에 투자준거를 적용하여 투자의 타당성을 판단한다.", "투자가치가 시장가치보다 클 경우 투자를 채택할 수 있다."], "ans": 2, "expl": "기대수익률이 요구수익률보다 높을 때(같거나 클 때) 투자를 채택한다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_046.m4a"}, {"no": 47, "part": "투자론", "theme": "비할인법-어림셈법(승수·수익률)", "headline": "어림셈법(승수법·수익률법)", "definition": "어림셈법: 시간가치를 고려하지 않고 한 해 소득 기준으로 투자여부를 판단하는 비할인법, 승수법·수익률법으로 구분", "bullets": ["승수법: 총투자액÷소득(작을수록 유리), 수익률법: 소득÷총투자액(클수록 유리)", "총소득승수=총투자액/유효총소득", "순소득승수(자본회수기간)=총투자액/순영업소득", "세전현금수지승수=지분투자액/세전현금수지"], "tip": "승수는 작을수록, 수익률은 클수록 투자에 유리", "q": "어림셈법(비할인법)에 관한 설명으로 옳지 않은 것은?", "choices": ["어림셈법은 시간가치를 고려하지 않고 한 해의 소득을 기준으로 투자여부를 판단한다.", "승수법에서는 승수의 값이 클수록 투자자에게 유리하다.", "순소득승수는 총투자액을 순영업소득으로 나눈 값으로 자본회수기간을 의미하기도 한다.", "종합자본환원율은 순영업소득을 총투자액으로 나눈 값이다.", "세전현금수지승수는 지분투자액을 세전현금수지로 나눈 값이다."], "ans": 2, "expl": "승수법에서는 승수의 값이 작을수록 자본회수기간이 짧아 투자자에게 유리하다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_047.m4a"}, {"no": 48, "part": "투자론", "theme": "비할인법-비율분석법", "headline": "비율분석법", "definition": "비율분석법: 대부비율·부채비율·부채감당률 등 각종 비율로 투자의 안전성·수익성을 분석하는 비할인법", "bullets": ["대부비율(LTV)=저당부채금액/부동산가치", "부채감당률(DCR)=순영업소득/부채서비스액, 1보다 작으면 상환능력 부족", "채무불이행률=(영업경비+부채서비스액)/유효총소득", "비율분석법은 지표 구성요소 추계 오류시 비율이 왜곡될 수 있다는 한계"], "tip": "부채감당률<1이면 순영업소득이 부채상환에 부족", "q": "비율분석법에 관한 설명으로 옳지 않은 것은?", "choices": ["비율분석법은 시간가치를 반영하여 투자안의 수익성을 정밀하게 분석하는 방법이다.", "대부비율은 부동산가치에 대한 저당부채금액의 비율을 의미한다.", "부채감당률은 순영업소득을 부채서비스액으로 나눈 기지는 시간이 지남에 따라 대출잔액이 점차 증가하는 구조이다.", "역모기지는 일반적으로 비소구형 대출로 운용된다.", "역모기지는 일반적인 원리금균등상환방식과 마찬가지로 대출잔액이 시간이 지날수록 감소한다.", "현재 우리나라에는 주택연금과 농지연금이 공적보증형태의 역모기지 제도로 시행되고 있다."], "ans": 4, "expl": "역모기지는 대출잔액이 시간이 지날수록 증가하는 구조로, 원금이 점차 감소하는 일반적인 상환방식과는 반대이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_056.m4a"}, {"no": 57, "part": "금융론", "theme": "저당의 유동화 개념과 구조", "headline": "저당의 유동화", "definition": "저당의 유동화: 저당권을 상품화하여 유통시켜 대출기관의 장기대출자금 조기회수를 가능케 하는 제도, 1차 저당시장·2차 저당시장으로 구성", "bullets": ["1차 저당시장: 차입자와 대출기관 간 저당이 설정되는 소매금융시장", "2차 저당시장: 대출기관과 기관투자자 간 저당을 유동화하는 도매금융시장", "저당유동화로 대출기관의 유동성위험 감소, 자금의 장기고정화 완화", "저당수익률 구조: 원대출채권수익률>저당담보증권수익률>투자자요구수익률"], "tip": "1차시장=소매(설정) / 2차시장=도매(유동화)", "q": "저당의 유동화 개념과 구조에 관한 설명으로 옳지 않은 것은?", "choices": ["1차 저당시장은 차입자와 저당대출기관 사이에 저당이 설정되는 시장이다.", "2차 저당시장은 저당대출기관과 다른 기관투자자들 사이에 형성되는 시장이다.", "저당의 유동화는 대출기관의 유동성위험을 감소시키는 효과가 있다.", "저당수익률의 구조상 원대출채권의 수익률이 저당담보증권의 수익률보다 낮아야 유동화가 원활하다.", "대출기관은 특수목적회사(SPC)를 설립하여 저당을 유동화할 수 있다."], "ans": 4, "expl": "저당유동화가 원활히 이루어지려면 원대출채권의 수익률(1차 저당시장)이 저당담보증권의 수익률(2차 저당시장)보다 높아야 하며, 저당담보증권의 수익률은 다시 투자자의 요구수익률보다 높아야 한다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_057.m4a"}, {"no": 58, "part": "금융론", "theme": "주택저당증권(MBS)의 종류", "headline": "주택저당증권(MBS)의 종류", "definition": "MBS: 주택저당채권을 기초로 발행하는 증권, 이체증권(MPTS)·저당담보채권(MBB)·지불이체채권(MPTB)·다계층증권(CMO)으로 구분", "bullets": ["MPTS: 원리금수취권·저당권 모두 투자자에게 이전(지분증권), 콜방어 불가능", "MBB: 원리금수취권·저당권 모두 발행기관 보유(채권), 콜방어 가능, 투자자위험 최소", "MPTB: 저당권은 발행기관, 원리금수취권은 투자자(MBB+MPTS 혼합)", "CMO: 트랜치별로 이자율·상환순서 다르게 설계, 증권+채권 혼합성격"], "tip": "MPTS=지분·콜방어불가 / MBB=채권·콜방어가능(투자자 위험 최소)", "q": "주택저당증권(MBS)의 종류에 관한 설명으로 옳지 않은 것은?", "choices": ["MPTS는 원리금수취권과 저당권이 모두 투자자에게 이전되는 지분증권 성격을 갖는다.", "MBB는 발행기관이 원리금수취권과 저당권을 모두 보유하며 투자자의 위험이 가장 작다.", "MPTB는 저당권은 발행기관이 보유하고 원리금수취권은 투자자에게 이전되는 혼합형 증권이다.", "MPTS는 발행기관이 콜방어를 실현할 수 있어 MBB보다 투자자의 위험이 작다.", "CMO는 트랜치별로 이자율과 원금 지급순서가 상이하게 설계된 다계층증권이다."], "ans": 4, "expl": "MPTS는 조기상환위험(콜위험)을 투자자가 부담하며 콜방어가 불가능하다. 콜방어가 가능하여 투자자 위험이 가장 작은 것은 MBB이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_058.m4a"}, {"no": 59, "part": "금융론", "theme": "부동산투자회사(REITs)의 개념과 종류", "headline": "부동산투자회사(REITs)", "definition": "부동산투자회사(REITs): 자산을 부동산에 투자·운용하는 것을 주된 목적으로 설립된 회사, 자기관리·위탁관리·기업구조조정 리츠로 구분", "bullets": ["자기관리REITs: 자산운용 전문인력을 상근으로 두고 직접 투자·운용", "위탁관리REITs: 자산의 투자·운용을 자산관리회사에 위탁, 직원·상근임원 불가", "기업구조조정REITs: 기업구조조정 부동산 대상, 자산관리회사에 위탁", "자본금 요건: 자기관리 5억원 이상, 위탁관리·기업구조조정 3억원 이상(설립시)"], "tip": "자기관리=직접운용(상근인력) / 위탁관리·기업구조조정=자산관리회사에 위탁", "q": "부동산투자회사(REITs)의 개념과 종류에 관한 설명으로 옳지 않은 것은?", "choices": ["부동산투자회사는 자산을 부동산에 투자하여 운용하는 것을 주된 목적으로 설립된 회사이다.", "자기관리부동산투자회사는 자산운용 전문인력을 포함한 임직원을 상근으로 두고 직접 투자·운용을 수행한다.", "위탁관리부동산투자회사는 본점 외에 지점을 두고 직원을 고용할 수 있다.", "위탁관리부동산투자회사는 자산의 투자·운용을 자산관리회사에 위탁한다.", "기업구조조정부동산투자회사는 기업구조조정 부동산을 대상으로 투자한다."], "ans": 3, "expl": "위탁관리부동산투자회사와 기업구조조정부동산투자회사는 본점 외의 지점을 둘 수 없고, 직원을 고용하거나 상근임원을 둘 수 없다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_059.m4a"}, {"no": 60, "part": "금융론", "theme": "리츠(REITs)의 특징과 규제동향", "headline": "리츠의 특징과 자산운용규제", "definition": "REITs의 규제: 총자산 중 부동산 비중, 이익의 대부분 배당 의무 등 자산운용상 각종 규제", "bullets": ["최저자본금준비기간 경과 후 총자산의 80% 이상 부동산·부동산관련증권·현금으로 구성(부동산 70%↑)", "이익배당한도의 90% 이상을 주주에게 배당", "차입금 및 사채발행은 자기자본의 2배를 초과할 수 없음", "REITs 도입으로 부동산시장의 투명성 제고, 부동산투기 차단 효과 기대"], "tip": "배당비율 90%↑ / 부동산비중 70%↑(총자산 중 부동산+증권+현금 80%↑)", "q": "부동산투자회사(REITs)의 특징과 자산운용규제에 관한 설명으로 옳지 않은 것은?", "choices": ["부동산투자회사는 최저자본금준비기간이 끝난 후 매 분기말 총자산의 80% 이상을 부동산, 부동산관련증권 및 현금으로 구성하여야 한다.", "부동산투자회사는 해당 연도 이익배당한도의 90% 이상을 주주에게 배당하여야 한다.", "부동산투자회사는 주주 보호를 위해 이익배당한도 전액을 이익준비금으로 적립하여야 한다.", "부동산투자회사의 차입금 및 사채발행은 자기자본의 2배를 초과할 수 없다.", "부동산투자회사 도입으로 부동산시장의 투명성이 제고되고 부동산투기 차단 효과가 기대된다."], "ans": 3, "expl": "부동산투자회사는 이익배당한도의 90% 이상을 주주에게 배당하며 별도의 이익준비금은 적립하지 않는다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_060.m4a"}, {"no": 61, "part": "금융론", "theme": "프로젝트 파이낸싱(PF)의 특징", "headline": "프로젝트 파이낸싱(PF)", "definition": "프로젝트 파이낸싱(PF): 사업 자체의 수익성·현금흐름을 담보로 자금을 조달하는 금융기법, 비소구 또는 제한소구 방식(대출원리금 상환의무 제한)", "bullets": ["프로젝트회사(SPC)가 차입주체가 되어 법적으로 사업주와 신용절연", "대출기관 위험이 커서 이자율이 높은 편", "사업주 대차대조표에 부채로 계상 안됨(부외금융), 채무수용능력 제고", "다양한 이해관계자의 참여로 위험 분산되나 사업진행 속도는 느림"], "tip": "PF=비소구·제한소구금융, 부외금융(off-balance)", "q": "프로젝트 파이낸싱(PF)에 관한 설명으로 옳지 않은 것은?", "choices": ["프로젝트 파이낸싱은 사업 자체의 수익성과 현금흐름을 담보로 자금을 조달하는 방식이다.", "프로젝트 파이낸싱은 대출원리금 상환의무가 제한되는 비소구 또는 제한소구금융의 성격을 가진다.", "대출기관이 부담하는 위험이 크기 때문에 일반대출보다 이자율이 높은 편이다.", "다양한 이해관계자가 참여하여 위험을 분산시킬 수 있지만 사업진행 속도는 느려질 수 있다.", "프로젝트회사가 부담하는 채무는 사업주(스폰서)의 대차대조표에 부채로 계상된다."], "ans": 5, "expl": "프로젝트 파이낸싱은 사업주의 대차대조표에 차입금이 부채로 계상되지 않는 부외금융(off-balance sheet financing)의 특징을 가진다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_061.m4a"}, {"part": "금융론", "theme": "지분금융·부채금융·메자닌금융", "headline": "부동산금융의 3대 분류", "definition": "부동산금융의 3대 분류: 자기자본 조달 지분금융, 타인자본 조달 부채금융, 중간적 성격의 메자닌금융", "bullets": ["지분금융: 신디케이트·조인트벤처·리츠(REITs)·주식 공모(사모)·간접투자펀드", "부채금융: 저당금융·신탁증서금융·회사채·주택저당담보증권(MBS)·자산유동화증권(ABS)", "메자닌금융: 신주인수권부사채(BW)·전환사채(CB)·교환사채(EB)·후순위채권·상환우선주", "메자닌금융은 무담보·후순위 성격으로 부채와 지분의 중간적 자금조달방법"], "tip": "지분=자기자본 조달, 부채=타인자본 조달, 메자닌=그 중간(후순위채 성격)", "q": "부동산금융의 조달방식에 관한 설명으로 옳지 않은 것은?", "choices": ["주택저당담보증권(MBS)과 자산유동화증권(ABS)은 지분금융에 해당한다.", "신디케이트(syndicate)와 조인트벤처(joint venture)는 지분금융에 해당한다.", "저당금융과 신탁증서금융은 부채금융에 해당한다.", "메자닌금융(mezzanine financing)은 부채방식과 지분방식의 특징을 함께 갖는 중간적 성격의 자금조달방법이다.", "신주인수권부사채(BW), 전환사채(CB)는 메자닌금융의 예로 볼 수 있다."], "ans": 1, "expl": "주택저당담보증권(MBS)과 자산유동화증권(ABS)은 저당권 설정이나 채권 발행을 통해 타인자본을 조달하는 부채금융에 해당한다.", "no": 62, "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_062.m4a"}, {"no": 63, "part": "금융론", "theme": "자산유동화증권(ABS)", "headline": "자산유동화증권(ABS)", "definition": "자산유동화증권(ABS): 저당대부·신용카드채권 등 현금수지가 보장되는 자산을 담보로 발행하는 부채증권(주택저당채권은 MBS로 유동화)", "bullets": ["기초자산(현금흐름 보장 자산)을 담보로 발행하는 부채증권", "자산보유자는 유리한 금리로 자금조달 가능(재무구조 개선)", "기초자산이 담보가 되어 투자자에게 비교적 안전한 투자대상", "ABCP(자산유동화기업어음)는 만기가 짧아 PF 자금조달에 활용"], "tip": "ABS 중 주택저당채권을 기초로 한 것이 MBS", "q": "자산유동화증권(ABS)에 관한 설명으로 옳지 않은 것은?", "choices": ["자산유동화증권은 현금수지가 보장되는 자산을 담보로 발행하는 부채증권이다.", "ABCP는 만기가 긴 특성 때문에 프로젝트파이낸싱(PF) 분야의 자금조달에는 활용되지 않는다.", "자산보유자는 자산유동화를 통해 금융기관 차입보다 유리한 금리로 자금을 조달할 수 있다.", "자산유동화증권은 기초자산이 담보가 되므로 투자자에게 비교적 안전한 투자대상이 된다.", "주택저당채권을 기초로 발행되는 자산유동화증권을 MBS라 한다."], "ans": 2, "expl": "ABCP(자산유동화기업어음)는 비교적 만기가 짧은 상품으로 프로젝트파이낸싱(PF) 분야의 자금조달 방법으로 널리 활용되고 있다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_063.m4a"}, {"no": 64, "part": "금융론", "theme": "기타 부동산금융상품(P2P 등)", "headline": "기타 부동산금융상품", "definition": "기타 부동산금융상품: PF·신디케이트·ABS 외 부동산펀드, P2P금융 등 다양한 자금조달 방식", "bullets": ["부동산펀드는 투자신탁(수익증권)과 투자회사(뮤추얼펀드) 형태로 구분", "투자신탁의 투자자 지위는 수익자, 투자회사의 투자자 지위는 주주", "P2P금융: 온라인 플랫폼을 통해 다수 개인투자자로부터 자금을 모아 부동산에 대출·투자", "최근 금융플랫폼을 활용한 새로운 부동산금융상품이 확대되는 추세"], "tip": "투자신탁=수익자·수익증권 / 투자회사=주주·주식", "q": "기타 부동산금융상품에 관한 설명으로 옳지 않은 것은?", "choices": ["부동산펀드는 투자신탁(수익증권)과 투자회사(뮤추얼펀드)의 법적 형태로 구분된다.", "투자신탁에서 투자자의 지위는 수익자이며 투자지분은 수익증권으로 표시된다.", "부동산펀드와 P2P금융은 최근 금융환경 변화와 무관하게 이용이 감소하는 추세이다.", "투자회사에서 투자자의 지위는 주주이며 투자지분은 주식으로 표시된다.", "P2P금융은 온라인 플랫폼을 통해 다수의 개인투자자로부터 자금을 모아 부동산에 투자·대출하는 방식이다."], "ans": 3, "expl": "최근 금융플랫폼의 발달로 부동산펀드, P2P금융 등을 통한 부동산금융상품 이용이 오히려 확대되는 추세이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_064.m4a"}, {"no": 65, "part": "관리개발", "theme": "부동산이용활동과 인접지 문제", "headline": "부동산이용과 인접지 문제", "definition": "인접지 문제: 부동성 등 특성으로 인한 경계문제, 협동적 이용의 필요성 등", "bullets": ["부동성에서 파생: 경계문제, 협동적 이용 필요성 발생", "부동산활동은 인접지역과의 지역분석이 필수적으로 요구됨", "용도의 다양성으로 인접토지 간 용도상 대체가능성 존재", "인접지 문제는 외부효과(정/부)와도 밀접하게 관련됨"], "tip": "부동성→경계문제·지역분석 필요성 파생", "q": "부동산이용활동과 인접지 문제에 관한 설명으로 옳지 않은 것은?", "choices": ["부동산의 인접지 문제(경계문제)는 토지의 부동성에서 파생되는 특성이다.", "부동산은 인접성으로 인해 협동적 이용의 필요성이 발생한다.", "인접지 문제는 외부효과와는 무관하게 발생하는 독립적인 현상이다.", "부동산활동에서는 대상부동산이 속한 인근지역에 대한 지역분석이 요구된다.", "토지는 용도의 다양성으로 인해 인접토지 간 용도상 대체가능성이 존재한다."], "ans": 3, "expl": "인접지 문제는 인접 토지이용에 따른 정(+) 또는 부(-)의 외부효과와 밀접하게 관련되어 발생한다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_065.m4a"}, {"no": 66, "part": "관리개발", "theme": "토지이용의 집약화·입체화 현상", "headline": "토지이용의 집약화·입체화", "definition": "토지이용의 집약화: 좁은 면적의 토지에 자본·노동을 집중투입, 건물 고층화·입체화로 이용도를 높이는 현상", "bullets": ["집약도=투입되는 노동과 자본의 양/단위면적토지", "집약한계(상한선): 한계비용=한계수입 지점, 조방한계(하한선): 총수입=총비용 지점", "규모의 경제·인구밀도 증가·지가상승 등이 집약화 촉진", "도심은 지가↑→자본↑→집약도↑(고층화), 외곽은 지가↓→집약도↓(저층화)"], "tip": "집약한계=상한선(MC=MR) / 조방한계=하한선(TR=TC)", "q": "토지이용의 집약화·입체화 현상에 관한 설명으로 옳지 않은 것은?", "choices": ["토지이용의 집약도는 단위면적의 토지에 투입되는 노동과 자본의 양으로 나타낸다.", "집약한계는 한계비용과 한계수입이 일치하는 지점으로 토지이용 집약도의 상한선이다.", "조방한계는 총수입과 총비용이 일치하는 지점으로 토지이용 집약도의 하한선이다.", "도심지역은 지가가 높아 자본투입이 늘어나므로 토지이용이 집약화되고 건물이 고층화된다.", "규모의 경제, 인구밀도의 증가는 토지이용의 집약화를 저해하는 요인이다."], "ans": 5, "expl": "규모의 경제와 인구밀도의 증가는 토지이용을 집약화시키는 요인이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_066.m4a"}, {"no": 67, "part": "관리개발", "theme": "부동산개발의 개념과 위험", "headline": "부동산개발의 개념과 위험", "definition": "부동산개발: 인간에게 필요한 공간을 창조하는 활동, 법률적 위험·시장위험·비용위험 등 다양한 위험 수반", "bullets": ["워포드: 법률적 위험, 시장위험, 비용위험부담으로 구분", "법률적 위험: 인허가 불확실성, 용도지역제·이용규제 변화 등", "시장위험: 수요·공급·가격의 불확실성(임대·분양 실패 등)", "흡수율이 높을수록 시장위험 감소, 선분양시 시장위험 낮고 분양가는 낮음"], "tip": "법률적·시장·비용위험(워포드) 3대 개발위험", "q": "부동산개발의 개념과 위험에 관한 설명으로 옳지 않은 것은?", "choices": ["워포드는 부동산개발의 위험을 법률적 위험부담, 시장위험부담, 비용위험부담으로 구분하였다.", "법률적 위험부담에는 행정인허가의 불확실성이나 용도지역제 변화 등이 포함된다.", "흡수율분석을 통한 흡수율이 높을수록 개발사업의 시장위험은 감소한다.", "선분양방식은 후분양방식보다 일반적으로 시장위험이 낮고 분양가가 낮은 경향이 있다.", "이미 이용계획이 확정된 토지를 구입하면 법률적 위험이 오히려 커진다."], "ans": 5, "expl": "이미 이용계획이 확정된 토지를 구입하는 경우에는 법률적 위험이 최소화된다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_067.m4a"}, {"no": 68, "part": "관리개발", "theme": "부동산개발의 방식(자체·지주공동)", "headline": "부동산개발방식(자체·지주공동)", "definition": "부동산개발방식의 구분: 토지소유자 직접시행의 자체개발사업, 토지소유자·개발업자 공동시행의 지주공동사업 등", "bullets": ["자체개발사업: 토지소유자가 직접 기획·자금조달·건설, 이익 전액 귀속되나 위험도 큼", "지주공동사업: 토지소유자(토지)+개발업자(노하우), 위험을 분산하는 장점", "지주공동사업 유형: 공사비대물교환방식, 분양금공사비지급방식, 사업위탁형, 등가교환방식 등", "토지신탁형은 신탁회사에 형식상 소유권 이전 후 개발·관리·처분"], "tip": "자체개발=위험 전부 부담, 지주공동사업=위험 분산", "q": "부동산개발의 방식(자체·지주공동)에 관한 설명으로 옳지 않은 것은?", "choices": ["자체개발사업은 토지소유자가 사업기획과 자금조달을 직접 담당하는 방식이다.", "자체개발사업은 개발이익이 모두 토지소유자에게 귀속되나 사업위험도 크다.", "지주공동사업은 토지소유자와 개발업자가 부동산개발의 위험을 분산할 수 있다는 장점이 있다.", "토지신탁형은 자체개발사업과 마찬가지로 토지소유권이 토지소유자에게 그대로 유지된다.", "공사비 대물교환방식은 토지소유자가 공사대금을 완공된 건물의 일부로 변제하는 방식이다."], "ans": 4, "expl": "토지신탁형은 사업위탁방식과 달리 신탁회사에 형식상의 소유권이 이전된다는 점이 특징이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_068.m4a"}, {"no": 69, "part": "관리개발", "theme": "민간투자사업방식(BTO·BTL 등)", "headline": "민간투자사업방식(BTO·BTL 등)", "definition": "민간투자사업방식: 민간자본 유치를 통한 인프라시설 건설·운영 방식, BTO·BTL·BOT·BOO 등으로 구분", "bullets": ["BTO(건설-양도-운영): 완공 후 정부에 소유권 양도, 민간이 운영하며 이용자에게 사용료 부과", "BTL(건설-양도-임대): 완공 후 소유권 양도, 정부 등에 임대하여 임대료 수취", "BOT(건설-운영-양도): 일정기간 소유·운영 후 계약만료시 정부에 양도", "BOO(건설-소유-운영): 사업시행자가 시설 소유권을 영구히 보유(양도 없음)"], "tip": "BTO=이용자 사용료, BTL=정부 임대료 / BOO=소유권 영구보유", "q": "민간투자사업방식(BTO·BTL 등)에 관한 설명으로 옳지 않은 것은?", "choices": ["BTO 방식은 시설 완공 후에도 소유권을 민간사업자가 계속 보유한다는 점에서 BOO 방식과 동일하다.", "BTO 방식은 시설 완공 후 소유권을 정부에 양도하고 민간사업자가 일정기간 운영하며 사용료를 받는 방식이다.", "BTL 방식은 시설 완공 후 소유권을 정부에 양도하고 정부 등에 임대하여 임대료를 받는 방식이다.", "BOT 방식은 사업시행자가 일정기간 소유권을 가지고 운영한 뒤 계약만료 후 정부에 양도하는 방식이다.", "BOO 방식은 사업시행자가 시설의 소유권을 영구히 보유하며 정부에 양도하지 않는 방식이다."], "ans": 1, "expl": "BTO 방식은 시설 완공 후 소유권을 정부(지방정부)에 양도하는 방식으로, 소유권을 영구히 보유하는 BOO 방식과는 다르다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_069.m4a"}, {"no": 70, "part": "관리개발", "theme": "도시개발사업방식(수용·환지 등)", "headline": "도시개발사업방식(수용·환지)", "definition": "도시개발사업방식의 구분: 공공 매수 후 개발하는 수용방식, 개발 후 원소유자 재분배하는 환지방식, 혼용방식", "bullets": ["수용방식: 공공이 토지를 전면 매수, 개발이익이 원토지소유자에게 귀속되기 어려움", "환지방식: 개발 후 비용·공공용지 제외한 토지를 원소유자에게 재분배, 체비지로 재원 확보", "수용방식은 환지방식보다 사업비 부담이 크고 기반시설 확보가 용이", "환지방식은 수용방식보다 원소유자의 재정착이 쉽고 사업시행자의 매각부담이 적음"], "tip": "수용방식=매수·개발이익 소유자귀속× / 환지방식=재분배·체비지로 재원충당", "q": "도시개발사업방식(수용·환지 등)에 관한 설명으로 옳지 않은 것은?", "choices": ["수용방식은 환지방식에 비해 종전 토지소유자에게 개발이익이 귀속될 가능성이 큰 편이다.", "수용방식은 공공부문이 토지를 전면 매수하여 개발하는 방식이다.", "환지방식은 개발 후 사업비와 공공용지를 제외한 토지를 원토지소유자에게 재분배하는 방식이다.", "개발사업의 재원으로 확보해 놓은 토지를 체비지라고 한다.", "환지방식은 수용방식에 비해 종전 토지소유자의 재정착이 쉬운 편이다."], "ans": 1, "expl": "수용방식은 개발사업 후 종전 토지소유권이 소멸되므로 개발이익이 토지소유자에게 귀속될 가능성이 오히려 작다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_070.m4a"}, {"no": 71, "part": "관리개발", "theme": "부동산관리의 방식(자가·위탁 등)", "headline": "부동산관리 방식(자가·위탁·혼합)", "definition": "부동산관리방식의 구분: 관리주체에 따라 자가관리(소유자 직접)·위탁관리(전문업체)·혼합관리(병용)", "bullets": ["자가관리: 가장 오래된 전통적 방식, 신속한 의사결정·강한 통제력이 장점", "위탁관리: 현대적 전문관리방식, 소유자는 본업에 전념, 전문성 확보 장점", "혼합관리: 자가+위탁 병용, 과도기적 방식이나 책임소재 불분명 단점", "부동산관리 발달순서: 자가관리 → 혼합관리 → 위탁관리"], "tip": "발달순서 자가→혼합→위탁", "q": "부동산관리의 방식(자가·위탁 등)에 관한 설명으로 옳지 않은 것은?", "choices": ["부동산관리는 일반적으로 위탁관리에서 자가관리로 발달해왔다.", "자가관리방식은 관리방식 중 가장 오래된 전통적인 방식이다.", "자가관리방식은 의사결정이 신속하고 소유자의 지시 및 통제권이 강하다는 장점이 있다.", "위탁관리방식은 소유자가 본업에 전념할 수 있고 전문가의 관리서비스를 받을 수 있다는 장점이 있다.", "혼합관리방식은 일부는 자가관리, 일부는 위탁관리를 병용하는 방식이다."], "ans": 1, "expl": "부동산관리는 일반적으로 자가관리에서 혼합관리를 거쳐 위탁관리로 발달해왔다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_071.m4a"}, {"no": 72, "part": "관리개발", "theme": "부동산관리의 영역(시설·자산관리)", "headline": "부동산관리의 영역", "definition": "부동산관리의 세 영역: 시설관리·재산관리(기업관리)·자산관리(가장 중요)", "bullets": ["시설관리: 시설을 운영·유지하는 소극적·기술적 관리", "재산관리(기업관리): 임대차관리 등 일상적 건물운영·관리, 운영수익 극대화 목적", "자산관리: 부동산가치를 증진시키는 적극적 관리, 포트폴리오 관점에서 접근", "관리내용상으로는 법률적 관리, 경제적 관리, 기술적 관리로도 구분"], "tip": "자산관리(가장 적극적)>재산관리>시설관리(가장 소극적)", "q": "부동산관리의 영역(시설·자산관리)에 관한 설명으로 옳지 않은 것은?", "choices": ["부동산관리 세 영역 중 가장 소극적이고 중요도가 낮은 영역은 자산관리이다.", "부동산관리의 영역은 시설관리, 재산관리, 자산관리로 구분할 수 있다.", "시설관리는 시설사용자의 요구에 부응하는 소극적이고 기술적인 측면의 관리이다.", "재산관리는 임대차관리 등 일상적인 건물운영 및 관리를 의미한다.", "자산관리는 부동산의 가치를 증진시키기 위한 방법을 모색하는 적극적 관리를 의미한다."], "ans": 1, "expl": "부동산관리의 세 가지 영역 중 가장 중요하고 적극적인 영역은 자산관리이며, 가장 소극적인 영역은 시설관리이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_072.m4a"}, {"no": 73, "part": "관리개발", "theme": "부동산마케팅 전략(STP)", "headline": "부동산마케팅전략(STP)", "definition": "STP전략: 시장세분화(Segmentation)·표적시장 선정(Targeting)·포지셔닝(Positioning)으로 구성되는 시장점유 마케팅전략", "bullets": ["시장세분화: 수요자집단을 인구·경제적 특성별로 하위시장으로 구분", "표적시장선정: 세분시장 중 공략할 목표고객집단 확인", "포지셔닝: 고객의 마음속에 자사 상품·서비스 이미지를 각인", "시장점유 마케팅전략에는 STP전략과 4P Mix전략이 있음"], "tip": "STP=세분화→표적선정→포지셔닝 순서", "q": "부동산마케팅 전략(STP)에 관한 설명으로 옳지 않은 것은?", "choices": ["STP전략은 시장세분화, 표적시장선정, 포지셔닝의 단계로 구성된다.", "시장세분화는 수요자 집단을 인구·경제적 특성에 따라 하위시장으로 나누는 것이다.", "STP전략은 고객점유 마케팅전략에 해당하며 AIDA원리를 기초로 한다.", "표적시장선정은 세분화된 시장 중 공략할 목표고객집단을 확인하는 단계이다.", "포지셔닝은 표적고객의 마음속에 자사 상품의 이미지를 자리잡게 하는 전략이다."], "ans": 3, "expl": "STP전략은 시장점유 마케팅전략에 해당한다. AIDA원리를 기초로 하는 것은 고객점유 마케팅전략이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_073.m4a"}, {"no": 74, "part": "관리개발", "theme": "부동산마케팅믹스(4P)", "headline": "부동산마케팅믹스(4P)", "definition": "4P Mix전략: 제품·가격·유통경로·판매촉진 4가지 측면의 차별화를 도모하는 시장점유 마케팅전략", "bullets": ["Product(제품전략): 경쟁력 있는 상품(구조물·부대시설 등) 기획", "Price(가격전략): 시가·저가·고가·할인정책 등 소비자 유인 가격 수립", "Place(유통경로): 입지선정과 토지확보, 지역·개별요인 분석", "Promotion(판매촉진): 홍보·광고·인적판매 등 커뮤니케이션 전략"], "tip": "4P=Product·Price·Place·Promotion", "q": "부동산마케팅믹스(4P)에 관한 설명으로 옳지 않은 것은?", "choices": ["4P Mix전략은 제품, 가격, 유통경로, 판매촉진의 측면에서 차별화를 도모하는 전략이다.", "유통경로(Place) 전략은 입지선정과 토지확보에 관한 전략을 포함한다.", "가격전략(Price)에는 시가정책, 저가정책, 고가정책, 할인정책 등이 있다.", "판매촉진전략(Promotion)은 시장세분화와 표적시장 선정을 핵심 내용으로 한다.", "제품전략(Product)은 경쟁력 있는 구조물, 부대시설 등 상품계획에 관한 전략이다."], "ans": 4, "expl": "판매촉진전략(Promotion)은 홍보, 광고, 인적판매 등 커뮤니케이션에 관한 전략이다. 시장세분화와 표적시장 선정은 STP전략의 내용이다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_074.m4a"}, {"part": "관리개발", "theme": "임대차의 유형(조·순·비율임대차)", "headline": "임대차 유형 3가지", "definition": "임대차의 유형 구분: 임대료 수준·비용부담 방식에 따라 조(粗)임대차·순임대차·비율임대차", "bullets": ["조임대차: 임차인이 조임대료만 지불, 임대인이 세금·보험료 등 부담(주거용에 적용)", "순임대차: 임차인이 순임대료+영업경비 일부 부담(공업용에 적용, 3차 순임대차가 보편적)", "비율임대차: 임차인 총수입의 일정비율을 임대료로 지불(상업용·매장용에 적용)", "임차인 선정기준도 용도별로 상이: 주거용=연대성, 공업용=적합성, 상업용=수익성"], "tip": "조=주거용(gross), 순=공업용(net), 비율=상업용(percentage)", "q": "부동산 임대차의 유형에 관한 설명으로 옳지 않은 것은?", "choices": ["조임대차는 임차인이 조임대료를 지불하고 임대인이 부동산세금 등 운영비용을 부담하는 방식으로 주거용 부동산에 많이 적용된다.", "순임대차는 임차인이 순수한 임대료 외에 영업경비의 일부를 사전협상에 따라 부담하는 방식으로 공업용 부동산에 많이 적용된다.", "비율임대차는 임차인의 총수입 중 일정비율을 임대료로 지불하는 방식으로 매장용 부동산에 일반적으로 적용된다.", "임차인의 선정기준은 부동산의 용도와 관계없이 항상 수익성을 기준으로 결정된다.", "공업용 부동산에서는 통상 세금·보험료·유지수선비까지 포함하는 3차 순임대차가 보편적으로 적용된다."], "ans": 4, "expl": "임차인의 선정기준은 부동산의 용도에 따라 다르며, 주거용은 연대성, 공업용은 적합성, 상업용(매장용)은 수익성(가능매상고)이 기준이 된다.", "no": 75, "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_075.m4a"}, {"no": 76, "part": "관리개발", "theme": "부동산중개계약의 유형", "headline": "부동산중개계약의 유형", "definition": "부동산중개계약의 유형: 의뢰인·중개업자 간 책임·의무 정도에 따라 일반·전속·독점·공동·순가중개계약 등", "bullets": ["일반중개계약: 불특정 다수 중개업자에게 경쟁적으로 의뢰(우리나라에서 가장 일반적)", "전속중개계약: 특정 중개업자에게만 의뢰, 의뢰인이 직접 계약시 수수료 미지급", "독점중개계약: 누가 계약을 성립시켰든 지정 중개업자가 보수를 받음(중개업자에 유리)", "순가중개계약: 의뢰인이 제시한 가격 초과분을 중개업자가 전액 수수료로 취득"], "tip": "전속=직접계약시 수수료 없음 / 독점=누가 계약해도 보수 지급", "q": "부동산중개계약의 유형에 관한 설명으로 옳지 않은 것은?", "choices": ["일반중개계약은 의뢰인이 불특정 다수의 중개업자에게 경쟁적으로 중개를 의뢰하는 방식이다.", "전속중개계약은 의뢰인이 특정한 개업공인중개사 한 명에게만 중개를 의뢰하는 계약이다.", "독점중개계약은 누가 계약을 성립시켰는지에 관계없이 지정된 중개업자가 보수를 받는 방식이다.", "순가중개계약은 의뢰인이 제시한 가격을 초과한 금액을 중개업자가 수수료로 취득하는 방식이다.", "전속중개계약에서 의뢰인이 직접 거래를 성사시킨 경우에도 중개업자는 수수료를 받는다."], "ans": 5, "expl": "전속중개계약에서 의뢰인이 직접 거래를 성사시킨 경우에는 중개업자가 수수료를 받지 못한다.", "audio": "https://pub-5d2c529faccc44daa5a2d4bdea2cd6f4.r2.dev/theme_076.m4a"}, {"no": 77, "part": "관리개발", "theme": "공인중개사법 주요내용", "headline": "공인중개사법 주요내용", "definition": "공인중개사법: 부동산중개업의 자격·등록·업무범위·수수료 등 중개업 전반을 규율하는 법률", "bullets": ["중개업자가 적법하게 수수료를 받으려면 자격증 소지·원인행위·중개계약존재·매수자적절성 필요", "도시부동산보다 농촌부동산, 주거용보다 비주거용 부동산의 수수료가 높은 경향", "매매가격이 높을수록 상대적으로 수수료율은 낮아지는 경향", "전속중개계약이 우리나라 공인중개사법에 명문화되어 있으나 강제의무사항은 아님"], "tip": "거래빈도 낮을수록(농촌·비주거) 수수료 높음", "q": "공인중개사법 주요내용에 관한 설명으로 옳지 않은 것은?", "choices": ["우리나라 공인중개사법에는 전속중개계약이 명문화되어 있으며 이를 반드시 체결해야 하는 강제의무사항이다.", "중개업자가 적법하게 중개수수료를 받기 위해서는 자격증 소지 등의 요건을 갖추어야 한다.", "다른 조건이 같다면 도시부동산보다 농촌부동산의 중개수수료가 더 높은 경향이 있다.", "다른 조건이 같다면 주거용 부동산보다 비주거용 부동산의 중개수수료가 더 높은 경향이 있다.", "매매가격이 비싼   return THEMES.filter(t => t.part === part).sort((a,b) => a.no - b.no);
}

  return THEMES.find(t => t.no === Number(no));
}
function scorePct() {
  const total = THEMES.length;

}

      <div class="part-card-head">
        <div class="part-badge" style="background:${meta.color}">${meta.label.slice(0,2)}</div>
        <div class="pname">${meta.label.slice(3)}</div>
        <div class="pcount">${list.length}개 테마</div>
      </div>
      <div class="part-progress-bar"><div class="part-progress-fill" style="width:${pct}%; background:${meta.color}"></div></div>
      <div class="part-card-sub">${doneCnt} / ${list.length} 학습 완료 · 테마 보기</div>
      <div class="theme-chip-grid"></div>
    `;
    const chipGrid = card.querySelector('.theme-chip-grid');
    list.forEach(t => {
      const st = progress[t.no];
      const chip = document.createElement('a');
      chip.className = 'theme-chip';
      chip.href = `#/theme/${t.no}`;
      chip.innerHTML = `<span class="tno">${t.no}</span><span>${t.theme}</span><span class="status-dot ${st || ''}"></span>`;
      chip.onclick = (e) => e.stopPropagation();
      chipGrid.appendChild(chip);
    });
    card.addEventListener('click', (e) => {
      if (e.target.closest('.theme-chip')) return;
      card.classList.toggle('expanded');
    });
    grid.appendChild(card);
  });
}

/* ---------------- Theme detail view ---------------- */
function renderTheme(no) {
  const t = getTheme(no);
  if (!t) { location.hash = '#/'; return; }
  document.body.classList.add('theme-view');
  const meta = PART_META[t.part];
  const list = themesByPart(t.part);
  const idx = list.findIndex(x => x.no === t.no);
  const prev = list[idx - 1];
  const next = list[idx + 1];

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="crumb">
      <a href="#/">전체 대시보드</a><span class="sep">/</span>
      <span>${meta.label.slice(3)}</span><span class="sep">/</span>
      <span>${t.theme}</span>
    </div>
    <div class="theme-header">
      <div class="theme-no-badge" style="background:${meta.color}">${t.no}</div>
      <div>
        <h2>${t.theme}</h2>
        <div class="part-tag">${meta.label.slice(3)}</div>
      </div>
    </div>

    <div class="audio-bar">
      ${t.audio
        ? `<button class="audio-toggle-btn" id="audioToggleBtn">🎧 해설강의 듣기</button>
           <audio class="audio-player" id="audioPlayer" controls controlsList="nodownload" oncontextmenu="return false" preload="none" style="display:none;">
             <source src="${t.audio}" type="audio/mp4">
             이 브라우저는 오디오 재생을 지원하지 않습니다.
           </audio>
           <div class="audio-status" id="audioStatus" style="display:none;"></div>`
        : `<span class="audio-placeholder">🎧 해설강의 준비중</span>`}
    </div>

    <div class="card">
      <span class="card-label step1">STEP 1 · 핵심 요약</span>
      <div class="headline">${t.headline}</div>
      <p class="definition">${t.definition}</p>
      <ul class="bullets">${t.bullets.map(b => `<li><span class="bmark"></span><span>${b}</span></li>`).join('')}</ul>
      <div class="tip-box"><span class="tip-icon">💡</span><span><b>암기포인트&nbsp;</b>${t.tip}</span></div>
    </div>

    <div class="card">
      <span class="card-label step2">STEP 2 · 개념확인 문제</span>
      <p class="question-text">${t.q}</p>
      <div class="choices" id="choices"></div>
      <div class="result-banner" id="resultBanner"></div>
      <div class="explain-box" id="explainBox">
        <div class="elabel">정답 &amp; 해설</div>
        <p id="explainText"></p>
      </div>
      <div class="quiz-actions"><button class="retry-btn" id="retryBtn">↺ 다시 풀기</button></div>
    </div>

    <div class="nav-footer">
      <a class="nav-btn ${prev ? '' : 'disabled'}" href="${prev ? '#/theme/'+prev.no : '#'}">← 이전</a>
      <a class="nav-btn list-btn" href="#/">≡ 전체 목록</a>
      <a class="nav-btn ${next ? '' : 'disabled'}" href="${next ? '#/theme/'+next.no : '#'}">다음 →</a>
    </div>
  `;

  const audioBtn = document.getElementById('audioToggleBtn');
  if (audioBtn) {
    const player = document.getElementById('audioPlayer');
    const status = document.getElementById('audioStatus');
    let watchdogTimer = null;
    let settled = false;

    audioBtn.onclick = () => {
      settled = false;
      audioBtn.style.display = 'none';
      player.style.display = 'block';
      status.style.display = 'none';

      const onReady = () => {
        if (settled) return;
        settled = true;
        clearTimeout(watchdogTimer);
      };
      player.addEventListener('canplay', onReady, { once: true });
      player.addEventListener('playing', onReady, { once: true });

      // 재생에 실패하면 반드시 pause()부터 호출해 "안내 문구는 떴는데 소리는 몰래 계속 나는"
      // 상황을 방지함. 다운로드 유도 링크는 넣지 않음(음성파일 다운로드를 막기 위함)
      const giveUp = () => {
        if (settled) return;
        settled = true;
        try { player.pause(); } catch (e) {}
        player.style.display = 'none';
        status.style.display = 'block';
        status.textContent = '⚠️ 이 브라우저에서는 재생이 원활하지 않습니다. 페이지를 새로고침한 뒤 다시 시도해주세요.';
      };

      // 진행률 기반 워치독: 데이터가 계속 들어오는 동안(progress 이벤트)에는 8초씩 유예를 계속 연장하고,
      // 8초 동안 진행이 완전히 없을 때만 실패로 판단. 전체 30초를 넘기면 무조건 종료(무한 대기 방지)
      const hardDeadline = Date.now() + 30000;
      const scheduleWatchdog = () => {
        clearTimeout(watchdogTimer);
        const remaining = hardDeadline - Date.now();
        const delay = Math.max(0, Math.min(8000, remaining));
        watchdogTimer = setTimeout(giveUp, delay);
      };
      player.addEventListener('progress', scheduleWatchdog);
      player.addEventListener('error', () => { clearTimeout(watchdogTimer); giveUp(); }, { once: true });
      scheduleWatchdog();

      player.play().catch(() => {});
    };
  }

  const choicesWrap = document.getElementById('choices');

  function paintResult(selectedIdx) {
    const correctIdx = t.ans - 1;
    Array.from(choicesWrap.children).forEach((btn, i) => {
      btn.disabled = true;
      const markSpan = btn.querySelector('.choice-mark');
      if (i === correctIdx) {
        btn.classList.add('correct-answer');
        markSpan.textContent = '정답';
        markSpan.classList.add('ok');
      } else if (i === selectedIdx) {
        btn.classList.add('wrong-answer');
        markSpan.textContent = '선택';
        markSpan.classList.add('no');
      }
    });
    const banner = document.getElementById('resultBanner');
    const isCorrect = selectedIdx === correctIdx;
    banner.classList.add('show', isCorrect ? 'ok' : 'no');
    banner.innerHTML = isCorrect
      ? '✓ 정답입니다!'
      : `✕ 오답입니다. 정답은 ${CIRC[correctIdx]}번 입니다.`;
    document.getElementById('explainText').textContent = t.expl;
    document.getElementById('explainBox').classList.add('show');
    document.getElementById('retryBtn').classList.add('show');
  }

  function buildChoices() {
    choicesWrap.innerHTML = '';
    t.choices.forEach((c, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.innerHTML = `<span class="choice-num">${CIRC[i]}</span><span>${c}</span><span class="choice-mark"></span>`;
      btn.onclick = () => {
        if (btn.disabled) return;
        btn.classList.add('selected');
        progress[t.no] = (i === t.ans - 1) ? 'correct' : 'incorrect';
        paintResult(i);
        updateHeaderProgress();
        refreshStatusDots(t.no);
      };
      choicesWrap.appendChild(btn);
    });
  }
  buildChoices();

  document.getElementById('retryBtn').onclick = () => {
    delete progress[t.no];
    document.getElementById('resultBanner').className = 'result-banner';
    document.getElementById('explainBox').classList.remove('show');
    document.getElementById('retryBtn').classList.remove('show');
    buildChoices();
    updateHeaderProgress();
    refreshStatusDots(t.no);
  };
}

function refreshStatusDots(no) {
  const st = progress[no];
  document.querySelectorAll(`a[href="#/theme/${no}"] .status-dot`).forEach(d => {
    d.classList.remove('correct','incorrect');
    if (st) d.classList.add(st);
  });
}

/* ---------------- Router ---------------- */
function route() {
  const hash = location.hash || '#/';
  const m = hash.match(/^#\/theme\/(\d+)/);
  if (m) {
    renderTheme(m[1]);
    window.scrollTo({top:0, behavior:'instant'});
  } else {
    renderHome();
    window.scrollTo({top:0, behavior:'instant'});
  }
  updateHeaderProgress();
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
